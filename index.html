      /**
       * ---- 오늘의 표현 드릴 ----
       * 기본 문장 하나를 정해 두고 주어와 동사 사이에 뉘앙스 덩어리(don't, went, gonna,
       * might, can, have to, wanna, used to, 질문형…)를 넣었다 뺐다 하는 연습.
       * 한국어 상황을 보고 첫마디를 먼저 내뱉은 뒤 카드를 눌러 영어를 확인한다.
       */
      const LS_DAILY_DRILL_KEY = "english-card-daily-drill";
      /**
       * 조동사 드릴은 '오늘의 표현'과 진행 캐시를 분리해 서로 덮어쓰지 않는다.
       * 뉘앙스 규칙을 바꾸면 키 뒤 버전을 올려 예전 규칙으로 만든 세트를 버린다.
       */
      const LS_MODAL_DRILL_KEY = "english-card-modal-drill-v5";
      /** have been 드릴 진행 캐시. 카드 규칙을 바꾸면 버전을 올려 예전 세트를 버린다. */
      const LS_HAVEBEEN_DRILL_KEY = "english-card-havebeen-drill-v4";
      /** have been 시제 대비(지금·과거·과거→지금) 드릴의 진행 캐시. 활용 드릴과 분리 저장한다. */
      const LS_HAVEBEEN_TENSE_DRILL_KEY = "english-card-havebeen-tense-drill-v1";

      /** 오늘 날짜의 드릴(문장 세트 + 진행 위치)을 불러온다. */
      function loadCachedDrill(cacheKey = LS_DAILY_DRILL_KEY) {
        try {
          const raw = localStorage.getItem(cacheKey);
          if (!raw) return null;
          const saved = JSON.parse(raw);
          if (
            saved.date === todayKey() &&
            saved.data &&
            Array.isArray(saved.data.drills) &&
            saved.data.drills.length > 0
          )
            return saved;
        } catch {}
        return null;
      }

      function saveCachedDrill(data, index, cacheKey = LS_DAILY_DRILL_KEY) {
        try {
          localStorage.setItem(
            cacheKey,
            JSON.stringify({ date: todayKey(), data, index: index || 0 })
          );
        } catch {}
      }

      /**
       * 완료한 표현 세트의 기록. 단어장과 같은 병합 규칙(key별 최신 ts, 삭제는 툼스톤)으로
       * 같은 wrongCardsSync 문서의 "drillHistory" 필드에 동기화된다.
       */
      const DRILL_HISTORY_STORE = { lsKey: "english-card-drill-history", field: "drillHistory" };

      /** 세트를 끝까지 완료하면 호출. 같은 날 같은 기본 문장은 한 번만 저장(갱신)된다. */
      function saveDrillHistoryEntry(data) {
        const key = `${todayKey()}|${String(data.base_en || "").trim().toLowerCase()}`;
        if (!key.split("|")[1]) return;
        const list = loadVocab(DRILL_HISTORY_STORE).filter((e) => e && e.key !== key);
        list.push({
          key,
          date: todayKey(),
          type: data.type || "verb",
          topic: data.topic || "",
          base_en: data.base_en || "",
          base_ko: data.base_ko || "",
          drills: data.drills || [],
          ts: Date.now(),
          deleted: false,
        });
        saveVocabLocal(list, DRILL_HISTORY_STORE);
        pushVocab(list, DRILL_HISTORY_STORE);
      }

      /** 새 문장이 지난 기록과 겹치지 않도록, 최근에 쓴 기본 문장 목록을 모은다. */
      function recentDrillBases(limit = 20) {
        const used = visibleVocab(loadVocab(DRILL_HISTORY_STORE)).map((e) =>
          String(e.base_en || "").trim()
        );
        for (const key of [LS_DAILY_DRILL_KEY, LS_MODAL_DRILL_KEY, LS_HAVEBEEN_DRILL_KEY, LS_HAVEBEEN_TENSE_DRILL_KEY]) {
          const cached = loadCachedDrill(key);
          if (cached && cached.data && cached.data.base_en) {
            used.unshift(String(cached.data.base_en).trim());
          }
        }
        return [...new Set(used.filter(Boolean))].slice(0, limit);
      }

      /** 조동사 드릴 15장의 정렬 순서. AI가 tag를 흘리거나 순서를 바꿔도 이 순서로 다시 세운다. */
      const MODAL_TAGS = [
        "기본",
        "가능성 can",
        "허락 can",
        "불가 can't",
        "금지 can't",
        "권고 should",
        "추측 should",
        "만류 shouldn't",
        "추측 shouldn't",
        "의무 have to",
        "불필요 don't have to",
        "추측 might",
        "추측 might not",
        "결심 will",
        "계획 gonna",
      ];

      /**
       * '가능성 can / 추측 should / 추측 shouldn't' 세 장은 AI에게 맡기지 않는다.
       * 추측은 화자가 통제할 수 없는 일에만 붙어서 행동 동사구로는 만들 수 없는데,
       * 모델이 매번 동사구를 진행형으로 감싸거나(→ 의무로 읽힘) 영어와 한국어를
       * 어긋나게 만들었다. 검증된 영어–한국어 쌍을 세트로 두고 코드가 그대로 끼워 넣는다.
       */
      const MODAL_STATE_SETS = [
        {
          can: { en: "It can get pretty crowded.", ko: "꽤 붐빌 수도 있어." },
          should: { en: "She should be there by now.", ko: "걔 지금쯤 거기 도착했을 거야." },
          shouldnt: { en: "It shouldn't take long.", ko: "오래 안 걸릴 거야." },
        },
        {
          can: { en: "It can get expensive.", ko: "돈이 꽤 들 수도 있어." },
          should: { en: "It should be about ten dollars.", ko: "아마 10달러쯤 할 거야." },
          shouldnt: { en: "It shouldn't cost much.", ko: "얼마 안 할 거야." },
        },
        {
          can: { en: "He can be a little late sometimes.", ko: "걔 가끔 좀 늦을 수도 있어." },
          should: { en: "He should be home by now.", ko: "걔 지금쯤 집에 있을 거야." },
          shouldnt: { en: "He shouldn't be too far.", ko: "걔 그렇게 멀리 있진 않을 거야." },
        },
        {
          can: { en: "It can be tricky at first.", ko: "처음엔 좀 까다로울 수도 있어." },
          should: { en: "It should be pretty easy.", ko: "아마 꽤 쉬울 거야." },
          shouldnt: { en: "It shouldn't be that hard.", ko: "그렇게 어렵진 않을 거야." },
        },
        {
          can: { en: "It can take a while.", ko: "시간이 좀 걸릴 수도 있어." },
          should: { en: "It should take about ten minutes.", ko: "아마 10분쯤 걸릴 거야." },
          shouldnt: { en: "It shouldn't take more than an hour.", ko: "한 시간도 안 걸릴 거야." },
        },
        {
          can: { en: "It can get messy.", ko: "좀 지저분해질 수도 있어." },
          should: { en: "She should be done by now.", ko: "걔 지금쯤 다 했을 거야." },
          shouldnt: { en: "It shouldn't be a problem.", ko: "별문제 안 될 거야." },
        },
        {
          can: { en: "It can get pretty cold at night.", ko: "밤엔 꽤 추워질 수도 있어." },
          should: { en: "It should be warm today.", ko: "오늘 아마 따뜻할 거야." },
          shouldnt: { en: "It shouldn't rain today.", ko: "오늘 비 안 올 거야." },
        },
        {
          can: { en: "He can be pretty quiet sometimes.", ko: "걔 가끔 되게 조용할 수도 있어." },
          should: { en: "He should know the answer.", ko: "걔 아마 답 알 거야." },
          shouldnt: { en: "He shouldn't be busy right now.", ko: "걔 지금 바쁘진 않을 거야." },
        },
      ];

      /**
       * AI가 만든 12장(행동 동사구 카드)에 고정 세트 3장을 끼워 15장으로 세운다.
       * tag로 맞추고, tag가 어긋났으면 순서로 보완한다. 고정 3장은 어떤 경우에도 살아남는다.
       */
      function buildModalDrills(aiDrills, set) {
        const byTag = new Map();
        aiDrills.forEach((d) => {
          if (d.tag && !byTag.has(d.tag)) byTag.set(d.tag, d);
        });
        const pinned = {
          "가능성 can": set.can,
          "추측 should": set.should,
          "추측 shouldn't": set.shouldnt,
        };
        // 순서 보완용 커서. AI는 고정 3장을 뺀 12장만 순서대로 주므로 고정 칸에서는 넘기지 않는다.
        let cursor = 0;
        return MODAL_TAGS.map((tag) => {
          const pin = pinned[tag];
          if (pin) return { tag, ko: pin.ko, en: pin.en };
          const hit = byTag.get(tag) || aiDrills[cursor];
          cursor += 1;
          return hit ? { tag, ko: hit.ko, en: hit.en } : null;
        }).filter(Boolean);
      }

      /** have been 드릴 15장의 정렬 순서. 다섯 활용(명사·형용사·현재분사·표현·able to) × (긍정·부정·질문). */
      const HAVEBEEN_TAGS = [
        "명사", "명사 부정", "명사 질문",
        "형용사", "형용사 부정", "형용사 질문",
        "현재분사", "현재분사 부정", "현재분사 질문",
        "표현", "표현 부정", "표현 질문",
        "able to", "able to 부정", "able to 질문",
      ];

      /** AI가 tag 순서를 바꿔 보내면 정해진 순서로 다시 세운다. tag가 하나라도 어긋나면 받은 순서를 그대로 쓴다. */
      function orderHaveBeenDrills(aiDrills) {
        const byTag = new Map();
        aiDrills.forEach((d) => {
          if (d.tag && !byTag.has(d.tag)) byTag.set(d.tag, d);
        });
        if (HAVEBEEN_TAGS.every((t) => byTag.has(t))) {
          return HAVEBEEN_TAGS.map((t) => byTag.get(t));
        }
        return aiDrills;
      }

      /** "I've been a night owl lately." → "a night owl" 처럼 have been 문장에서 핵심 어구만 남긴다. */
      function haveBeenKeyPhrase(en) {
        let s = String(en || "").trim();
        s = s.replace(/^i'?ve been\s+/i, "").replace(/^i have been\s+/i, "");
        s = s.replace(/[.!?]\s*$/, "");
        s = s.replace(/\s+(lately|these days|recently|this week|nowadays)$/i, "");
        return s.trim();
      }

      /**
       * have been 세트의 제목용 요약. AI가 준 base_en 대신 긍정 카드 5장에서 코드가 직접 뽑아
       * 항상 짧고 정확하게 만든다. tag가 어긋난 세트는 카드 위치(0·3·6·9·12)로 보완한다.
       */
      function haveBeenSummary(drills) {
        const list = Array.isArray(drills) ? drills : [];
        const posTags = ["명사", "형용사", "현재분사", "표현", "able to"];
        let picked = posTags.map((t) => list.find((d) => d && d.tag === t)).filter(Boolean);
        if (picked.length < 3 && list.length >= 13) {
          picked = [0, 3, 6, 9, 12].map((i) => list[i]).filter(Boolean);
        }
        const parts = picked.map((d) => haveBeenKeyPhrase(d.en)).filter(Boolean);
        return parts.join(" / ");
      }

      /** have been 시제 대비 드릴 15장의 정렬 순서. 다섯 활용 × (지금·과거·과거→지금). */
      const HAVEBEEN_TENSE_TAGS = [
        "명사 지금", "명사 과거", "명사 과거→지금",
        "형용사 지금", "형용사 과거", "형용사 과거→지금",
        "현재분사 지금", "현재분사 과거", "현재분사 과거→지금",
        "표현 지금", "표현 과거", "표현 과거→지금",
        "able to 지금", "able to 과거", "able to 과거→지금",
      ];

      function orderHaveBeenTenseDrills(aiDrills) {
        const byTag = new Map();
        aiDrills.forEach((d) => {
          if (d.tag && !byTag.has(d.tag)) byTag.set(d.tag, d);
        });
        if (HAVEBEEN_TENSE_TAGS.every((t) => byTag.has(t))) {
          return HAVEBEEN_TENSE_TAGS.map((t) => byTag.get(t));
        }
        return aiDrills;
      }

      /** 시제 대비 세트의 제목: "과거→지금"(have been) 카드 5장에서 핵심 어구를 뽑는다. */
      function haveBeenTenseSummary(drills) {
        const list = Array.isArray(drills) ? drills : [];
        let picked = list.filter((d) => d && String(d.tag || "").includes("과거→지금"));
        if (picked.length < 3 && list.length >= 15) {
          picked = [2, 5, 8, 11, 14].map((i) => list[i]).filter(Boolean);
        }
        const parts = picked.map((d) => haveBeenKeyPhrase(d.en)).filter(Boolean);
        return parts.join(" / ");

15 "미래 질문" Are you gonna ...?`;

        const rule2 = isModal
          ? `그 문장을 아래 12가지 조동사 뉘앙스로 변형한다. 각 항목의 대괄호 안에 적힌 주어와 형태를 반드시 그대로 지킨다. 동사구는 한 글자도 바꾸지 않고 조동사만 갈아끼운다. 대괄호에 today가 적힌 항목에는 today를 붙인다.`
          : isHaveBeen
          ? `아래 15가지 순서대로 모든 문장을 현재완료(have been)로만 만든다. 각 항목의 대괄호 안 형태를 반드시 그대로 지킨다. 같은 활용 묶음(1–3, 4–6, 7–9, 10–12, 13–15)은 핵심 어구를 한 글자도 바꾸지 않고 I've been / I haven't been / Have you been만 갈아끼운다. lately, these days, this week 같은 기간 표현은 자연스러우면 붙이되, 같은 묶음 안에서는 똑같이 유지한다.`
          : isHaveBeenTense
          ? `아래 15가지 순서대로 만든다. 같은 활용 묶음(1–3, 4–6, 7–9, 10–12, 13–15)은 핵심 어구를 한 글자도 바꾸지 않고 시제 부분만 바꾼다: "지금" 카드는 I'm(현재), "과거" 카드는 I was + 끝난 과거 시점(yesterday, last week, before 등), "과거→지금" 카드는 I've been + 지금까지 이어지는 기간(lately, all day, for two weeks, since ~ 등). 시간 표현으로 세 시제의 차이가 또렷이 보이게 한다.`
          : `그 문장을 아래 15가지 뉘앙스로 변형한다. 뒤의 기본 덩어리는 절대 바꾸지 않고 뉘앙스 부분만 바꾼다.`;
        const rule3 = isModal
          ? `ko는 한국인이 실제로 내뱉는 짧은 반말로 쓰되, 각 항목의 ko 틀을 따라 조동사의 뉘앙스 차이가 눈에 보이게 쓴다. 서로 다른 두 카드의 ko가 똑같은 문장이 되면 안 된다.`
          : isHaveBeen
          ? `ko는 한국인이 실제로 내뱉는 짧은 반말로 쓰되, 각 항목의 ko 틀을 따라 "지금까지 계속"이라는 현재완료 뉘앙스가 눈에 보이게 쓴다. 영어 문장을 만든 뒤 ko는 직역하지 말고 "이 상황에서 한국인이라면 뭐라고 말할까"를 새로 떠올려 쓴다.`
          : isHaveBeenTense
          ? `ko는 한국인이 실제로 내뱉는 짧은 반말로 쓰되, 각 항목의 ko 틀을 따라 세 시제의 차이(지금 / 끝난 과거 / 지금까지 계속)가 눈에 보이게 쓴다. 직역하지 말고 같은 상황에서 한국인이 실제로 하는 말로 쓴다.`
          : `ko는 그 상황에서 한국인이 실제로 내뱉는 짧은 반말로 쓴다. (예: "나 드라이브 안 했어.", "너 여기 자주 와?")`;
        const modalExample = `
참고용 완성 예시 (동사구 "go to the gym", 이 문장은 그대로 쓰지 말 것):
1 기본 → I go to the gym. / 나 헬스장 다녀.
2 허락 can → You can go to the gym. / 너 헬스장 가도 돼.
3 불가 can't → I can't go to the gym today. / 나 오늘 헬스장 못 가.
4 금지 can't → You can't go to the gym today. / 너 오늘 헬스장 가면 안 돼.
5 권고 should → You should go to the gym. / 너 헬스장 다니는 게 좋아.
6 만류 shouldn't → You shouldn't go to the gym today. / 너 오늘은 헬스장 안 가는 게 좋아.
7 의무 have to → I have to go to the gym. / 나 꼭 헬스장 가야 해.
8 불필요 don't have to → You don't have to go to the gym. / 너 헬스장 안 가도 돼.
9 추측 might → I might go to the gym. / 나 헬스장 갈지도 몰라.
10 추측 might not → I might not go to the gym. / 나 헬스장 안 갈지도 몰라.
11 결심 will → I'll go to the gym. / 내가 헬스장 갈게.
12 계획 gonna → I'm gonna go to the gym. / 나 헬스장 갈 거야.
`;
        const haveBeenExample = `
참고용 완성 예시 (주제 "잠·휴식", 이 어구들은 그대로 쓰지 말 것):
1 명사 → I've been a night owl lately. / 나 요즘 계속 밤샘형 인간이야.
2 명사 부정 → I haven't been a night owl lately. / 나 요즘은 밤샘형 인간 아니야.
3 명사 질문 → Have you been a night owl lately? / 너 요즘 계속 밤늦게까지 깨 있어?
4 형용사 → I've been tired lately. / 나 요즘 계속 피곤해.
5 형용사 부정 → I haven't been tired lately. / 나 요즘은 별로 안 피곤해.
6 형용사 질문 → Have you been tired lately? / 너 요즘 계속 피곤해?
7 현재분사 → I've been sleeping in lately. / 나 요즘 계속 늦잠 자고 있어.
8 현재분사 부정 → I haven't been sleeping in lately. / 나 요즘 늦잠 안 자고 있어.
9 현재분사 질문 → Have you been sleeping in lately? / 너 요즘 계속 늦잠 자?
10 표현 → I've been on a break this week. / 나 이번 주 계속 쉬는 중이야.
11 표현 부정 → I haven't been on a break this week. / 나 이번 주 내내 못 쉬고 있어.
12 표현 질문 → Have you been on a break this week? / 너 이번 주 계속 쉬는 중이야?
13 able to → I've been able to sleep early. / 나 요즘 일찍 잘 수 있어.
14 able to 부정 → I haven't been able to sleep early. / 나 요즘 계속 일찍 못 자고 있어.
15 able to 질문 → Have you been able to sleep early? / 너 요즘 일찍 잘 수 있어?
`;
        const haveBeenTenseExample = `
참고용 완성 예시 (주제 "요리·음식", 이 어구들은 그대로 쓰지 말 것):
1 명사 지금 → I'm a coffee addict. / 나 커피 중독자야.
2 명사 과거 → I was a coffee addict in college. / 나 대학 땐 커피 중독자였어.
3 명사 과거→지금 → I've been a coffee addict lately. / 나 요즘 계속 커피 중독자야.
4 형용사 지금 → I'm hungry right now. / 나 지금 배고파.
5 형용사 과거 → I was hungry this morning. / 나 아침엔 배고팠어.
6 형용사 과거→지금 → I've been hungry all day. / 나 오늘 하루 종일 계속 배고파.
7 현재분사 지금 → I'm cooking dinner right now. / 나 지금 저녁 만드는 중이야.
8 현재분사 과거 → I was cooking dinner an hour ago. / 나 한 시간 전엔 저녁 만들고 있었어.
9 현재분사 과거→지금 → I've been cooking dinner since five. / 나 5시부터 계속 저녁 만들고 있어.
10 표현 지금 → I'm on a diet. / 나 지금 다이어트 중이야.
11 표현 과거 → I was on a diet last month. / 나 지난달엔 다이어트 중이었어.
12 표현 과거→지금 → I've been on a diet for two weeks. / 나 2주째 계속 다이어트 중이야.
13 able to 지금 → I'm able to eat spicy food. / 나 매운 거 먹을 수 있어.
14 able to 과거 → I was able to eat spicy food before. / 나 예전엔 매운 거 먹을 수 있었어.
15 able to 과거→지금 → I've been able to eat spicy food lately. / 나 요즘은 매운 거 잘 먹고 있어.
`;
        const prompt = `영어 회화 학습용 "${isModal ? "조동사 뉘앙스 드릴" : isHaveBeenTense ? "have been 시제 대비 드릴" : isHaveBeen ? "have been 활용 드릴" : "뉘앙스 드릴"}" 자료를 만들어줘.

1. ${baseRule}
2. ${rule2}
3. ${rule3}${avoidRule}

뉘앙스 순서 (tag는 그대로 사용):
${variants}
${isModal ? modalExample : isHaveBeen ? haveBeenExample : isHaveBeenTense ? haveBeenTenseExample : ""}
JSON만 출력:
{"base_en":"${isHaveBeen || isHaveBeenTense ? "다섯 핵심 어구를 ' / '로 이은 요약" : "기본 문장"}","base_ko":"${isHaveBeen || isHaveBeenTense ? "그 요약의 한국어 뜻" : "기본 문장의 한국어 뜻"}","drills":[{"tag":"${isHaveBeenTense ? "명사 지금" : isHaveBeen ? "명사" : "기본"}","ko":"한국어 상황","en":"영어 문장"} 형식으로 ${isModal ? 12 : 15}개]}`;

        const res = await fetch(GROQ_API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`,
          },
          body: JSON.stringify({
            model: GROQ_MODEL,
            messages: [{ role: "user", content: prompt }],
            temperature: 0.9,
            max_tokens: isModal || isHaveBeen || isHaveBeenTense ? 1800 : 1200,
          }),
        });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err?.error?.message || `API 오류 ${res.status}`);
        }
        const data = await res.json();
        const raw = data?.choices?.[0]?.message?.content || "";
        const match = raw.match(/\{[\s\S]*\}/);
        if (!match) throw new Error("응답 형식을 파싱하지 못했습니다.");
        const d = JSON.parse(match[0]);
        const drills = (Array.isArray(d.drills) ? d.drills : [])
          .map((it) => ({
            tag: String(it.tag || "").trim(),
            ko: String(it.ko || "").trim(),
            en: String(it.en || "").trim(),
          }))
          .filter((it) => it.ko && it.en);
        if (!drills.length) throw new Error("연습 문장을 만들지 못했습니다.");
        // 조동사 모드는 AI가 만든 동사구 12장에 고정 세트 3장을 끼워 15장으로 세운다.
        const finalDrills = isModal
          ? buildModalDrills(
              drills,
              MODAL_STATE_SETS[Math.floor(Math.random() * MODAL_STATE_SETS.length)]
            )
          : isHaveBeen
            ? orderHaveBeenDrills(drills)
            : isHaveBeenTense
              ? orderHaveBeenTenseDrills(drills)
              : drills;
        // have been 세트 제목은 AI에게 맡기지 않는다. (요약 대신 15문장 전체를 넣는 사고 방지)
        const haveBeenTitle = isHaveBeen
          ? haveBeenSummary(finalDrills)
          : isHaveBeenTense
            ? haveBeenTenseSummary(finalDrills)
            : "";
        return {
          type: isModal ? "modal" : isHaveBeen ? "haveBeen" : isHaveBeenTense ? "haveBeenTense" : isBe ? "be" : "verb",
          topic,
          base_en: haveBeenTitle || String(d.base_en || drills[0].en).trim(),
          base_ko: String(d.base_ko || drills[0].ko).trim(),
          drills: finalDrills,
        };
      }

      /**
       * 진행 화면. 카드(패널)를 누르면 영어가 보이고, 다 끝나면 전체 복습 목록이 나온다.
       * opts.practice: 지난 기록 다시 연습 모드 — 오늘 진행 캐시를 덮어쓰지 않고
       * 완료해도 기록에 다시 저장하지 않는다.
       * opts.cacheKey: 진행 캐시 저장 키 ('오늘의 표현'과 '조동사'가 분리 사용).
       */
      function renderDrillContent(panel, data, startIndex, opts = {}) {
        panel.style.display = "block";
        const total = data.drills.length;
        let i = Math.max(0, Math.min(startIndex || 0, total));
        let revealed = false;
        const persist = (idx) => {
          if (!opts.practice) saveCachedDrill(data, idx, opts.cacheKey || LS_DAILY_DRILL_KEY);
        };

        const paint = () => {
          closeWordDefinitionPanel();
          if (i >= total) {
            const doneHead = opts.practice
              ? `<p style="margin:0 0 0.6rem;font-size:0.95rem;color:#eef3fc;">🎉 복습 완료! 아래 목록으로 한 번 더 훑어보세요.</p>`
              : `<p style="margin:0 0 0.35rem;font-size:0.95rem;color:#eef3fc;">🎉 ${data.type === "modal" ? "조동사 드릴" : data.type === "haveBeen" ? "have been 드릴" : data.type === "haveBeenTense" ? "have been 시제 드릴" : "오늘의 표현"} 완료! 아래 목록으로 한 번 더 훑어보세요.</p>
                <p class="meta" style="margin:0 0 0.6rem;font-size:0.76rem;">이 목록은 자동으로 저장되었습니다. 📚 지난 기록에서 언제든 다시 볼 수 있습니다${
                  firebaseSyncEnabled() && getSyncCode() ? " (다른 기기에서도 보입니다)" : ""
                }.</p>`;
            panel.innerHTML = `
              <div style="width:100%;">
                ${doneHead}
                <div style="display:flex;flex-direction:column;gap:0.45rem;">
                  ${data.drills
                    .map(
                      (d) => `<div class="example-item" style="background:#0e1622;border-color:#243049;">
                        <div class="meta" style="font-size:0.72rem;color:var(--accent);">${escapeHtml(d.tag)}</div>
                        <div class="answer" data-en-context="${escapeHtml(d.en)}" style="margin-top:0.15rem;font-size:0.9rem;color:#dbe4f5;line-height:1.5;">${englishWordsInteractiveHtml(d.en)}</div>
                        <div class="ex-ko" style="margin:0.2rem 0 0;">${escapeHtml(d.ko)}</div>
                      </div>`
                    )
                    .join("")}
                </div>
                <div style="display:flex;justify-content:flex-end;gap:0.4rem;margin-top:0.6rem;">
                  <button type="button" class="tts-btn" id="btnDrillHistOpen">📚 지난 기록</button>
                  <button type="button" class="tts-btn" id="btnDrillRestart">↺ 처음부터 다시</button>
                </div>
              </div>`;
            const rs = document.getElementById("btnDrillRestart");
            if (rs)
              rs.onclick = (ev) => {
                ev.stopPropagation();
                i = 0;
                revealed = false;
                persist(0);
                paint();
              };
            const ho = document.getElementById("btnDrillHistOpen");
            if (ho)
              ho.onclick = (ev) => {
                ev.stopPropagation();
                renderDrillHistory(opts.origin);
              };
            return;
          }

          const cur = data.drills[i];
          const engBlock = revealed
            ? `<div style="background:#111827;border:1px solid #2d3a52;border-radius:8px;padding:0.65rem 0.8rem;">
                <div class="answer" data-en-context="${escapeHtml(cur.en)}" style="font-size:1.05rem;color:#eef3fc;line-height:1.6;">${englishWordsInteractiveHtml(cur.en)}</div>
                <div style="display:flex;justify-content:flex-end;margin-top:0.4rem;">
                  <button type="button" class="tts-btn" id="btnDrillSpeak">🔊 듣기</button>
                </div>
              </div>`
            : `<p class="hint" style="margin:0;">머릿속에 상황을 그리며 먼저 소리 내어 말해 보세요. 카드를 누르면 영어가 보입니다.</p>`;
          panel.innerHTML = `
            <div style="width:100%;">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:0.5rem;">
                <span class="meta" style="font-size:0.76rem;">${
                  data.type === "haveBeen"
                    ? `핵심 어구 · ${escapeHtml(haveBeenSummary(data.drills) || data.base_en)}`
                    : data.type === "haveBeenTense"
                      ? `핵심 어구 · ${escapeHtml(haveBeenTenseSummary(data.drills) || data.base_en)}`
                      : `기본 문장 · ${escapeHtml(data.base_en)}`
                }</span>
                <span class="meta">${i + 1} / ${total}</span>
              </div>
              <div style="margin-top:0.7rem;">
                <span style="display:inline-block;font-size:0.74rem;padding:0.15rem 0.55rem;border:1px solid #2a3a5c;border-radius:999px;color:var(--accent);">${escapeHtml(cur.tag)}</span>
              </div>
              <p style="margin:0.55rem 0 0.9rem;font-size:1.15rem;font-weight:700;color:#eef3fc;line-height:1.55;">${escapeHtml(cur.ko)}</p>
              ${engBlock}
              <div style="display:flex;justify-content:space-between;gap:0.5rem;margin-top:0.85rem;">
                <button type="button" class="secondary" id="btnDrillPrev" ${i === 0 ? "disabled" : ""}>← 이전</button>
                <button type="button" class="primary" id="btnDrillNext">${revealed ? (i === total - 1 ? "완료 ✓" : "다음 →") : "정답 보기"}</button>
              </div>
            </div>`;
          const prev = document.getElementById("btnDrillPrev");
          if (prev)
            prev.onclick = (ev) => {
              ev.stopPropagation();
              if (i > 0) {
                i--;
                revealed = false;
                persist(i);
                paint();
              }
            };
          const next = document.getElementById("btnDrillNext");
          if (next)
            next.onclick = (ev) => {
              ev.stopPropagation();
              if (!revealed) {
                revealed = true;
                paint();
                return;
              }
              i++;
              revealed = false;
              persist(i);
              // 세트를 끝까지 완료한 순간 기록에 저장(로컬 + 클라우드). 다시 연습 때는 제외.
              if (i >= total && !opts.practice) saveDrillHistoryEntry(data);
              paint();
            };
          const spk = document.getElementById("btnDrillSpeak");
          if (spk)
            spk.onclick = (ev) => {
              ev.stopPropagation();
              speakEnglish(cur.en);
            };
        };

        panel.onclick = (e) => {
          if (e.target.closest("button, select, .click-en")) return;
          if (i >= total) return;
          revealed = !revealed;
          paint();
        };
        paint();
      }

      /** 지난 기록의 세트를 한 문장씩 다시 연습한다. 오늘 진행 중인 '오늘의 표현'에는 영향이 없다. */
      function renderDrillPractice(entry) {
        closeWordDefinitionPanel();
        app.dataset.view = "drillPractice";
        dateLine.textContent = "지난 표현 연습";
        app.innerHTML = `
          <div class="gate-panel">
            <strong>지난 표현 연습</strong> · ${escapeHtml(entry.date || "")}에 완료한 세트를 다시 연습합니다. 상황을 떠올리며 첫마디를 바로 내뱉어 보세요.
          </div>
          <div class="gate-panel" id="drillPracticePanel" style="margin-top:0.6rem;min-height:150px;"></div>
          <div class="actions">
            <button type="button" class="secondary" id="btnPracticeBack">← 지난 기록으로</button>
            <button type="button" id="btnPracticeHome">모드 선택으로</button>
          </div>
        `;
        document.getElementById("btnPracticeBack").onclick = () => renderDrillHistory();
        document.getElementById("btnPracticeHome").onclick = () => renderModePicker();
        renderDrillContent(document.getElementById("drillPracticePanel"), entry, 0, { practice: true });
      }

      /** 지난 기록 화면에서 "돌아가기"가 향할 드릴 모드 ("drill" = 오늘의 표현, "modal" = 조동사, "haveBeen" = have been). */
      let drillHistoryOrigin = "drill";

      /** 드릴 모드별 기록 필터. '오늘의 표현'은 verb·be(및 type이 없는 옛 기록)를 묶는다. */
      function drillHistoryMatchesOrigin(entry, origin) {
        const ty = entry.type || "verb";
        if (origin === "modal") return ty === "modal";
        if (origin === "haveBeen") return ty === "haveBeen" || ty === "haveBeenTense";
        return ty === "verb" || ty === "be";
      }

      function drillOriginLabel(origin) {
        return origin === "modal" ? "조동사" : origin === "haveBeen" ? "have been" : "오늘의 표현";
      }

      /**
       * 기록 카드의 메타·제목·부제. have been 세트는 저장된 base_en 대신 카드에서 뽑은
       * 핵심 어구 요약을 쓴다 — AI가 base_en에 15문장을 통째로 넣었던 옛 기록도 이걸로 정리된다.
       */
      function drillHistoryTitleParts(e) {
        if (e.type === "haveBeen") {
          const summary = haveBeenSummary(e.drills);
          return {
            metaSuffix: " · have been" + (e.topic ? ` · ${e.topic}` : ""),
            title: summary || e.base_en || "",
            sub: "",
          };
        }
        if (e.type === "haveBeenTense") {
          const summary = haveBeenTenseSummary(e.drills);
          return {
            metaSuffix: " · have been 시제" + (e.topic ? ` · ${e.topic}` : ""),
            title: summary || e.base_en || "",
            sub: "",
          };
        }
        return {
          metaSuffix: e.type === "be" ? " · 느낌(be)" : e.type === "modal" ? " · 조동사" : "",
          title: e.base_en || "",
          sub: e.base_ko || "",
        };
      }

      /** 완료한 표현 세트 기록 화면. 들어온 드릴의 기록만 보여주고, 탭으로 다른 드릴 기록을 오갈 수 있다. */
      function renderDrillHistory(origin) {
        if (origin) drillHistoryOrigin = origin;
        closeWordDefinitionPanel();
        app.dataset.view = "drillHistory";
        dateLine.textContent = "지난 표현 기록";

        const draw = (list) => {
          if (app.dataset.view !== "drillHistory") return;
          const originLabel = drillOriginLabel(drillHistoryOrigin);
          const items = visibleVocab(list).filter((e) =>
            drillHistoryMatchesOrigin(e, drillHistoryOrigin)
          );
          const tabsHtml = [
            { key: "drill", label: "오늘의 표현" },
            { key: "modal", label: "조동사" },
            { key: "haveBeen", label: "have been" },
          ]
            .map(
              (t) => `<button type="button" class="tts-btn drill-hist-tab" data-o="${t.key}" style="padding:0.3rem 0.6rem;${
                t.key === drillHistoryOrigin ? "border-color:var(--accent);color:var(--accent);font-weight:600;" : ""
              }">${t.label}</button>`
            )
            .join("");
          const body = items.length
            ? items
                .map((e, idx) => {
                  const tp = drillHistoryTitleParts(e);
                  return `<div class="example-item" style="display:flex;flex-direction:column;gap:0.3rem;">
                    <div class="drill-hist-head" data-i="${idx}" style="display:flex;justify-content:space-between;align-items:baseline;gap:0.5rem;cursor:pointer;">
                      <div>
                        <div class="meta" style="font-size:0.72rem;">${escapeHtml(e.date || "")}${escapeHtml(tp.metaSuffix)}</div>
                        <strong style="font-size:0.95rem;color:#e4ecff;">${escapeHtml(tp.title)}</strong>
                        ${tp.sub ? `<div class="meta" style="font-size:0.78rem;">${escapeHtml(tp.sub)}</div>` : ""}
                      </div>
                      <div style="display:flex;gap:0.3rem;flex-shrink:0;">
                        <button type="button" class="tts-btn drill-hist-practice" data-i="${idx}" aria-label="한 문장씩 다시 연습" style="color:var(--accent);">▶ 연습</button>
                        <button type="button" class="tts-btn drill-hist-toggle" data-i="${idx}">펼치기</button>
                        <button type="button" class="tts-btn drill-hist-del" data-k="${escapeHtml(e.key)}" aria-label="기록 삭제">🗑</button>
                      </div>
                    </div>
                    <div class="drill-hist-body" data-i="${idx}" style="display:none;flex-direction:column;gap:0.4rem;margin-top:0.3rem;">
                      ${(e.drills || [])
                        .map(
                          (d) => `<div class="example-item" style="background:#0e1622;border-color:#243049;">
                            <div class="meta" style="font-size:0.72rem;color:var(--accent);">${escapeHtml(d.tag)}</div>
                            <div class="answer" data-en-context="${escapeHtml(d.en)}" style="margin-top:0.15rem;font-size:0.88rem;color:#dbe4f5;line-height:1.5;">${englishWordsInteractiveHtml(d.en)}</div>
                            <div class="ex-ko" style="margin:0.2rem 0 0;">${escapeHtml(d.ko)}</div>
                          </div>`
                        )
                        .join("")}
                    </div>
                  </div>`;
                })
                .join("")
            : `<p class="meta" style="margin-top:0.8rem;">아직 '${escapeHtml(originLabel)}' 기록이 없습니다. ${escapeHtml(originLabel)} 드릴을 끝까지 완료하면 여기에 자동으로 저장됩니다.</p>`;
          app.innerHTML = `
            <div class="gate-panel">
              <strong>지난 표현 기록</strong> · <strong style="color:var(--accent);">${escapeHtml(originLabel)}</strong> 세트 <strong style="color:var(--accent);">${items.length}개</strong>. 항목을 누르면 문장 목록이 펼쳐집니다.${
                firebaseSyncEnabled() && getSyncCode()
                  ? " 같은 동기화 코드를 쓰는 기기끼리 자동으로 공유됩니다."
                  : ""
              }
              <div style="margin-top:0.55rem;display:flex;gap:0.4rem;flex-wrap:wrap;">${tabsHtml}</div>
            </div>
            <div style="display:flex;flex-direction:column;gap:0.55rem;margin-top:0.6rem;">${body}</div>
            <div class="actions" style="margin-top:0.9rem;">
              <button type="button" id="btnDrillHistBack">← ${drillHistoryOrigin === "modal" ? "조동사로" : drillHistoryOrigin === "haveBeen" ? "have been으로" : "오늘의 표현으로"}</button>
            </div>`;
          document.getElementById("btnDrillHistBack").onclick = () =>
            drillHistoryOrigin === "modal"
              ? renderModalDrill()
              : drillHistoryOrigin === "haveBeen"
                ? renderHaveBeenDrill()
                : renderDailyDrill();
          app.querySelectorAll(".drill-hist-tab").forEach((btn) => {
            btn.onclick = (ev) => {
              ev.stopPropagation();
              const o = btn.dataset.o || "drill";
              if (o === drillHistoryOrigin) return;
              drillHistoryOrigin = o;
              draw(loadVocab(DRILL_HISTORY_STORE));
            };
          });
          app.querySelectorAll(".drill-hist-practice").forEach((btn) => {
            const entry = items[Number(btn.dataset.i)];
            if (!entry) return;
            btn.onclick = (ev) => {
              ev.stopPropagation();
              renderDrillPractice(entry);
            };
          });
          app.querySelectorAll(".drill-hist-toggle").forEach((btn) => {
            btn.onclick = (ev) => {
              ev.stopPropagation();
              const b = app.querySelector(`.drill-hist-body[data-i="${btn.dataset.i}"]`);
              if (!b) return;
              const open = b.style.display !== "none";
              b.style.display = open ? "none" : "flex";
              btn.textContent = open ? "펼치기" : "접기";
            };
          });
          app.querySelectorAll(".drill-hist-head").forEach((head) => {
            head.onclick = (ev) => {
              if (ev.target.closest("button, .click-en")) return;
              const btn = app.querySelector(`.drill-hist-toggle[data-i="${head.dataset.i}"]`);
              if (btn) btn.click();
            };
          });
          app.querySelectorAll(".drill-hist-del").forEach((btn) => {
            btn.onclick = (ev) => {
              ev.stopPropagation();
              removeVocabWord(btn.dataset.k || "", DRILL_HISTORY_STORE);
              draw(loadVocab(DRILL_HISTORY_STORE));
            };
          });
        };

        draw(loadVocab(DRILL_HISTORY_STORE));
        // 백그라운드 동기화 후 최신 목록으로 다시 그린다.
        pullMergeVocab(DRILL_HISTORY_STORE).then((merged) => draw(merged));
      }

      async function renderDailyDrill(forceNew = false, forceType = null) {
        closeWordDefinitionPanel();
        app.dataset.view = "drill";
        dateLine.textContent = "오늘의 표현";

        const cached = loadCachedDrill();
        const curType = forceType || (cached && cached.data.type) || "verb";

        app.innerHTML = `
          <div class="gate-panel">
            <strong>오늘의 표현</strong> · 기본 문장 하나를 두고 뉘앙스(부정·과거·미래·의무·소망·질문)를 넣었다 뺐다 하는 연습입니다. 상황을 떠올리며 첫마디를 바로 내뱉어 보세요.
          </div>
          <div class="gate-panel" id="dailyDrillPanel" style="margin-top:0.6rem;min-height:150px;display:flex;align-items:center;justify-content:center;">
            <span class="meta">오늘의 표현을 준비하는 중…</span>
          </div>
          <div class="actions">
            <button type="button" class="secondary" id="btnDrillBack">← 돌아가기</button>
            <button type="button" class="secondary" id="btnDrillType">${curType === "be" ? "동사 문장으로" : "느낌(be) 문장으로"}</button>
            <button type="button" class="secondary" id="btnDrillHistory">📚 지난 기록</button>
            <button type="button" class="primary" id="btnDrillNew">🔁 다른 문장</button>
          </div>
        `;
        document.getElementById("btnDrillBack").onclick = () => renderModePicker();
        document.getElementById("btnDrillNew").onclick = () => renderDailyDrill(true, curType);
        document.getElementById("btnDrillType").onclick = () =>
          renderDailyDrill(true, curType === "be" ? "verb" : "be");
        document.getElementById("btnDrillHistory").onclick = () => renderDrillHistory("drill");

        const panel = document.getElementById("dailyDrillPanel");

        if (!forceNew && cached) {
          renderDrillContent(panel, cached.data, cached.index, { origin: "drill" });
          return;
        }

        try {
          const data = await generateDailyDrill(curType);
          if (app.dataset.view !== "drill") return;
          saveCachedDrill(data, 0);
          renderDrillContent(panel, data, 0, { origin: "drill" });
        } catch (e) {
          if (app.dataset.view !== "drill") return;
          panel.style.display = "block";
          panel.innerHTML = `<p class="word-def-error">${escapeHtml(e?.message || "오늘의 표현을 만들지 못했습니다.")}</p>`;
        }
      }

      /**
       * '조동사' 드릴. '오늘의 표현'과 같은 패턴으로, 기본 문장 하나를 두고
       * can(가능성·허락)/can't(불가능·금지)/should(권고·추측)/have to(의무)/
       * don't have to(불필요)/might(반반)/will·gonna(결심·계획)의 뉘앙스를 넣었다 뺐다 연습한다.
       */
      async function renderModalDrill(forceNew = false) {
        closeWordDefinitionPanel();
        app.dataset.view = "modalDrill";
        dateLine.textContent = "조동사";

        const cached = loadCachedDrill(LS_MODAL_DRILL_KEY);

        app.innerHTML = `
          <div class="gate-panel">
            <strong>조동사</strong> · 기본 문장 하나를 두고 조동사(can·can't·should·have to·might·will·gonna)를 넣었다 뺐다 하며 뉘앙스 차이를 익히는 연습입니다. 한국어 뉘앙스를 보고 첫마디를 바로 내뱉어 보세요.
            <p class="meta" style="margin:0.4rem 0 0;font-size:0.76rem;line-height:1.45;">'추측' 카드(가능성 can·추측 should·추측 shouldn't)만 문장이 바뀝니다. 추측은 내가 어쩔 수 없는 일에만 붙기 때문에, 같은 주제의 상태 문장(<em>She should be at the gym by now.</em>)으로 연습합니다.</p>
          </div>
          <div class="gate-panel" id="modalDrillPanel" style="margin-top:0.6rem;min-height:150px;display:flex;align-items:center;justify-content:center;">
            <span class="meta">조동사 드릴을 준비하는 중…</span>
          </div>
          <div class="actions">
            <button type="button" class="secondary" id="btnModalBack">← 돌아가기</button>
            <button type="button" class="secondary" id="btnModalHistory">📚 지난 기록</button>
            <button type="button" class="primary" id="btnModalNew">🔁 다른 문장</button>
          </div>
        `;
        document.getElementById("btnModalBack").onclick = () => renderModePicker();
        document.getElementById("btnModalNew").onclick = () => renderModalDrill(true);
        document.getElementById("btnModalHistory").onclick = () => renderDrillHistory("modal");

        const panel = document.getElementById("modalDrillPanel");
        const drillOpts = { cacheKey: LS_MODAL_DRILL_KEY, origin: "modal" };

        if (!forceNew && cached) {
          renderDrillContent(panel, cached.data, cached.index, drillOpts);
          return;
        }

        try {
          const data = await generateDailyDrill("modal");
          if (app.dataset.view !== "modalDrill") return;
          saveCachedDrill(data, 0, LS_MODAL_DRILL_KEY);
          renderDrillContent(panel, data, 0, drillOpts);
        } catch (e) {
          if (app.dataset.view !== "modalDrill") return;
          panel.style.display = "block";
          panel.innerHTML = `<p class="word-def-error">${escapeHtml(e?.message || "조동사 드릴을 만들지 못했습니다.")}</p>`;
        }
      }

      /** have been 화면에서 마지막으로 쓴 연습 종류 ("usage" = 활용, "tense" = 시제 대비). */
      let haveBeenDrillMode = "usage";

      /**
       * 'have been' 드릴. 두 가지 연습을 토글로 오간다.
       * - 활용(usage): have been / haven't been / Have you been을 다섯 활용에 끼워 연습.
       * - 시제 대비(tense): 같은 어구를 지금(I'm)·과거(I was)·과거→지금(I've been)으로 바꿔 말하며 차이를 익힘.
       * 두 세트는 진행 캐시를 분리 저장해 서로 오가도 진행이 유지된다.
       */
      async function renderHaveBeenDrill(forceNew = false, mode = null) {
        closeWordDefinitionPanel();
        if (mode) haveBeenDrillMode = mode;
        const isTense = haveBeenDrillMode === "tense";
        app.dataset.view = "haveBeenDrill";
        dateLine.textContent = isTense ? "have been 시제" : "have been";

        const cacheKey = isTense ? LS_HAVEBEEN_TENSE_DRILL_KEY : LS_HAVEBEEN_DRILL_KEY;
        const cached = loadCachedDrill(cacheKey);

        const introHtml = isTense
          ? `<strong>have been 시제 대비</strong> · 같은 어구를 ① 지금(<em>I'm</em>) ② 과거(<em>I was</em>) ③ 과거→지금(<em>I've been</em>) 세 시제로 바꿔 말하며 차이를 익히는 연습입니다. 한국어를 보고 첫마디를 바로 내뱉어 보세요.
            <p class="meta" style="margin:0.4rem 0 0;font-size:0.76rem;line-height:1.45;"><em>I was</em>는 그때로 끝난 일, <em>I've been</em>은 그때 시작해 지금도 이어지는 일입니다. 다섯 활용(명사·형용사·현재분사·표현·able to)마다 3장씩 총 15장입니다.</p>`
          : `<strong>have been 활용</strong> · 한 가지 주제를 두고 <em>have been / haven't been / Have you been</em>을 다섯 가지 활용에 끼워 "지금까지 계속"의 뉘앙스를 익히는 연습입니다. 한국어를 보고 첫마디를 바로 내뱉어 보세요.
            <p class="meta" style="margin:0.4rem 0 0;font-size:0.76rem;line-height:1.45;">① 명사 (<em>a night owl</em>) ② 형용사 (<em>busy</em>) ③ 현재분사 (<em>working out</em>) ④ 표현 (<em>on a date</em>) ⑤ able to (<em>able to sleep</em>) — 활용마다 긍정·부정·질문 3장씩 총 15장입니다.</p>`;

        app.innerHTML = `
          <div class="gate-panel">
            ${introHtml}
          </div>
          <div class="gate-panel" id="haveBeenDrillPanel" style="margin-top:0.6rem;min-height:150px;display:flex;align-items:center;justify-content:center;">
            <span class="meta">have been 드릴을 준비하는 중…</span>
          </div>
          <div class="actions">
            <button type="button" class="secondary" id="btnHaveBeenBack">← 돌아가기</button>
            <button type="button" class="secondary" id="btnHaveBeenMode">${isTense ? "활용 연습으로" : "시제 연습으로"}</button>
            <button type="button" class="secondary" id="btnHaveBeenHistory">📚 지난 기록</button>
            <button type="button" class="primary" id="btnHaveBeenNew">🔁 다른 문장</button>
          </div>
        `;
        document.getElementById("btnHaveBeenBack").onclick = () => renderModePicker();
        document.getElementById("btnHaveBeenMode").onclick = () =>
          renderHaveBeenDrill(false, isTense ? "usage" : "tense");
        document.getElementById("btnHaveBeenNew").onclick = () => renderHaveBeenDrill(true);
        document.getElementById("btnHaveBeenHistory").onclick = () => renderDrillHistory("haveBeen");

        const panel = document.getElementById("haveBeenDrillPanel");
        const drillOpts = { cacheKey, origin: "haveBeen" };

        if (!forceNew && cached) {
          renderDrillContent(panel, cached.data, cached.index, drillOpts);
          return;
        }

        try {
          const data = await generateDailyDrill(isTense ? "haveBeenTense" : "haveBeen");
          if (app.dataset.view !== "haveBeenDrill" || (haveBeenDrillMode === "tense") !== isTense) return;
          saveCachedDrill(data, 0, cacheKey);
          renderDrillContent(panel, data, 0, drillOpts);
        } catch (e) {
          if (app.dataset.view !== "haveBeenDrill" || (haveBeenDrillMode === "tense") !== isTense) return;
          panel.style.display = "block";
          panel.innerHTML = `<p class="word-def-error">${escapeHtml(e?.message || "have been 드릴을 만들지 못했습니다.")}</p>`;
        }
      }

      /** 단어장 화면에서 표현별로 생성한 예문을 세션 동안 기억한다. (key → [{situation, answer}]) */
      const vocabExampleCache = {};

      /** 생성된 예문 목록을 단어장용 HTML로 만든다. 영어는 탭해서 뜻을 볼 수 있다. */
      function vocabExamplesHtml(examples) {
        return (examples || [])
          .map(
            (ex) => `<div class="example-item" style="background:#0e1622;border-color:#243049;">
              <div class="answer" data-en-context="${escapeHtml(ex.answer)}" style="font-size:0.85rem;color:#dbe4f5;line-height:1.5;">${englishWordsInteractiveHtml(ex.answer)}</div>
              <div class="ex-ko" style="margin:0.25rem 0 0;">${escapeHtml(ex.situation)}</div>
            </div>`
          )
          .join("");
      }

      function vocabItemHtml(e) {
        const title = e.phonetic
          ? `${escapeHtml(e.word)} <span class="meta" style="font-weight:400;">${escapeHtml(e.phonetic)}</span>`
          : escapeHtml(e.word);
        const posLine = e.pos
          ? `<div class="meta" style="font-size:0.74rem;margin-top:0.1rem;">품사 · ${escapeHtml(e.pos)}</div>`
          : "";
        const contextLine = e.context
          ? `<div class="answer" data-en-context="${escapeHtml(e.context)}" style="margin-top:0.4rem;font-size:0.8rem;color:#c8d4e8;line-height:1.5;">${englishWordsInteractiveHtml(e.context)}</div>`
          : "";
        const cached = vocabExampleCache[e.key];
        const hasEx = Array.isArray(cached) && cached.length > 0;
        const exBlock = `<div class="vocab-ex-block" style="margin-top:0.5rem;flex-direction:column;gap:0.4rem;display:${hasEx ? "flex" : "none"};">${hasEx ? vocabExamplesHtml(cached) : ""}</div>`;
        return `<div class="example-item" style="display:flex;flex-direction:column;gap:0.15rem;">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:0.5rem;">
            <strong style="font-size:0.95rem;color:#e4ecff;">${title}</strong>
            <div style="display:flex;gap:0.3rem;flex-shrink:0;">
              <button type="button" class="tts-btn vocab-ex-btn" data-k="${escapeHtml(e.key)}" aria-label="예문 만들기">${hasEx ? "✨ 다시" : "✨ 예문"}</button>
              <button type="button" class="tts-btn vocab-speak" data-w="${escapeHtml(e.word)}" aria-label="단어 듣기">🔊</button>
              <button type="button" class="tts-btn vocab-del" data-k="${escapeHtml(e.key)}" aria-label="단어 삭제">🗑</button>
            </div>
          </div>
          <div style="font-size:0.98rem;font-weight:600;color:#eef3fc;">${escapeHtml(e.ko)}</div>
          ${posLine}
          ${contextLine}
          ${exBlock}
        </div>`;
      }

      function renderVocabBook(store = VOCAB_STORE) {
        closeWordDefinitionPanel();
        dateLine.textContent = store.title;
        app.dataset.view = store.view;

        const draw = (list) => {
          if (app.dataset.view !== store.view) return;
          const items = visibleVocab(list);
          const byKey = {};
          items.forEach((it) => { if (it && it.key) byKey[it.key] = it; });
          const body = items.length
            ? `<div style="display:flex;flex-direction:column;gap:0.55rem;margin-top:0.6rem;">${items
                .map(vocabItemHtml)
                .join("")}</div>`
            : `<p class="meta" style="margin-top:0.8rem;">${store.emptyMsg}</p>`;
          app.innerHTML = `
            <div class="gate-panel">
              <strong>${store.title}</strong> · 저장한 ${store.countLabel} <strong style="color:var(--accent);">${items.length}개</strong>. 단어를 누르면 뜻을 다시 볼 수 있습니다.${
                firebaseSyncEnabled() && getSyncCode()
                  ? " 같은 동기화 코드를 쓰는 기기끼리 자동으로 공유됩니다."
                  : ""
              }
            </div>
            ${body}
            <div class="actions" style="margin-top:0.9rem;">
              <button type="button" id="btnVocabBack">← 모드 선택으로</button>
            </div>`;
          document.getElementById("btnVocabBack").onclick = () => renderModePicker();
          app.querySelectorAll(".vocab-speak").forEach((btn) => {
            btn.onclick = (ev) => {
              ev.stopPropagation();
              speakEnglish(btn.dataset.w || "");
            };
          });
          app.querySelectorAll(".vocab-del").forEach((btn) => {
            btn.onclick = (ev) => {
              ev.stopPropagation();
              removeVocabWord(btn.dataset.k || "", store);
              draw(loadVocab(store));
            };
          });
          app.querySelectorAll(".vocab-ex-btn").forEach((btn) => {
            const entry = byKey[btn.dataset.k || ""];
            if (!entry) return;
            const item = btn.closest(".example-item");
            const block = item ? item.querySelector(".vocab-ex-block") : null;
            if (!block) return;
            let ac = null;
            btn.onclick = async (ev) => {
              ev.stopPropagation();
              if (ac) {
                ac.abort();
                ac = null;
                btn.textContent = vocabExampleCache[entry.key] ? "✨ 다시" : "✨ 예문";
                return;
              }
              ac = new AbortController();
              btn.textContent = "생성 중… (취소)";
              block.style.display = "flex";
              block.innerHTML = `<span class="meta">예문 생성 중…</span>`;
              try {
                const examples = await generateVocabExamples(entry.word, entry.ko, entry.context, ac.signal);
                vocabExampleCache[entry.key] = examples;
                block.innerHTML = examples.length
                  ? vocabExamplesHtml(examples)
                  : `<span class="meta">예문을 만들지 못했어요.</span>`;
                btn.textContent = "✨ 다시";
              } catch (err) {
                if (err.name === "AbortError") {
                  block.style.display = vocabExampleCache[entry.key] ? "flex" : "none";
                  if (vocabExampleCache[entry.key]) block.innerHTML = vocabExamplesHtml(vocabExampleCache[entry.key]);
                  else block.innerHTML = "";
                } else {
                  block.innerHTML = `<p class="meta" style="color:#f0b8c0;font-size:0.85rem;">${escapeHtml(err.message)}</p>`;
                }
                btn.textContent = vocabExampleCache[entry.key] ? "✨ 다시" : "✨ 예문";
              } finally {
                ac = null;
              }
            };
          });
        };

        draw(loadVocab(store));
        // 백그라운드 동기화 후 최신 목록으로 다시 그린다.
        pullMergeVocab(store).then((merged) => draw(merged));
      }

      /**
       * 모드 선택 화면에 들어올 때마다 단어장·메모장을 백그라운드로 동기화한다.
       * 다른 기기에서 담은 항목이 버튼 개수에 바로 반영되고, 저장 당시 업로드가
       * 실패해 로컬에만 남아 있던 변경도 이때 클라우드로 재업로드된다.
       */
      function backgroundSyncVocabStores() {
        if (!firebaseSyncEnabled() || !getSyncCode()) return;
        // DRILL_HISTORY_STORE는 버튼이 없어(btnId 없음) 개수 갱신 없이 동기화만 된다.
        [VOCAB_STORE, MEMO_STORE, DRILL_HISTORY_STORE].forEach((store) => {
          pullMergeVocab(store).then((merged) => {
            if (app.dataset.view !== "modePicker") return;
            if (!store.btnId) return;
            const btn = document.getElementById(store.btnId);
            if (btn) btn.textContent = `${store.btnLabel} (${visibleVocab(merged).length})`;
          });
        });
      }

      function renderModePicker() {
        app.dataset.view = "modePicker";
        dateLine.textContent = todayKey();
        const ttsRate = getSavedTtsRate();
        const face = getSavedCardFace();
        const selKo = face === "ko" ? "selected" : "";
        const selEn = face === "en" ? "selected" : "";
        app.innerHTML = `
          <div class="gate-panel">
            <strong>학습 모드 선택</strong> · 오늘은 어떤 모드로 학습할지 선택하세요.
          </div>
          <div class="actions">
            <button type="button" class="primary" id="btnModeDaily">일상 생활</button>
            <button type="button" class="primary" id="btnModeTruth">진리발표</button>
            <button type="button" class="primary" id="btnModeVerbs">조동사</button>
            <button type="button" class="primary" id="btnModeHaveBeen">have been 활용</button>
            <button type="button" class="primary" id="btnModeBible">오늘의 표현</button>
            <button type="button" id="btnVocabBook">📒 내 단어장 (${visibleVocab(loadVocab()).length})</button>
            <button type="button" id="btnMemoBook">📔 내 메모장 (${visibleVocab(loadVocab(MEMO_STORE)).length})</button>
          </div>
          <div class="gate-panel" style="margin-top:0.6rem;">
            <strong>설정</strong>
            <div style="margin-top:0.65rem;display:flex;flex-direction:column;gap:0.85rem;">
              <div>
                <strong style="font-size:0.88rem;">카드 첫 화면</strong>
                <div style="margin-top:0.4rem;display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                  <label for="modeCardFace" class="meta" style="font-size:0.8rem;">앞면 언어</label>
                  <select id="modeCardFace" class="tts-voice" aria-label="카드 앞면 언어">
                    <option value="ko" ${selKo}>한국어</option>
                    <option value="en" ${selEn}>영어</option>
                  </select>
                </div>
                <p class="meta" style="margin:0.35rem 0 0;font-size:0.76rem;line-height:1.45;">처음에 보일 면입니다. 카드를 누르면 반대쪽 내용이 함께 보입니다.</p>
              </div>
              <div>
                <strong style="font-size:0.88rem;">OpenAI API 키</strong>
                <div style="margin-top:0.4rem;display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                  <input type="password" id="modeGeminiKey"
                    style="flex:1;min-width:0;background:#111827;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:0.3rem 0.5rem;font-size:0.8rem;font-family:inherit;"
                    placeholder="sk-..."
                    value="${escapeHtml(getGeminiApiKey())}" />
                  <button type="button" id="btnSaveGeminiKey" class="tts-btn">저장</button>
                </div>
                <p class="meta" style="margin:0.35rem 0 0;font-size:0.76rem;line-height:1.45;">카드 뒤집은 후 ✨ AI 예문 생성 버튼으로 새 예문을 만들 수 있습니다.</p>
              </div>
              <div>
                <strong style="font-size:0.88rem;">TTS 재생속도</strong>
                <div style="margin-top:0.4rem;display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                  <label for="modeTtsRate" class="meta" style="font-size:0.8rem;">읽기 속도</label>
                  <select id="modeTtsRate" class="tts-voice" aria-label="TTS 재생속도 선택">
                    ${[0.5, 0.6, 0.7, 0.8, 0.9, 1.0]
                      .map((rate) => {
                        const selected = Math.abs(ttsRate - rate) < 0.001 ? "selected" : "";
                        return `<option value="${rate.toFixed(1)}" ${selected}>${rate.toFixed(1)}x</option>`;
                      })
                      .join("")}
                  </select>
                </div>
              </div>
              <div>
                <strong style="font-size:0.88rem;">오답·단어장 기기 간 동기화</strong>
                ${firebaseSyncEnabled()
                  ? `<div style="margin-top:0.4rem;display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                      <input type="text" id="modeSyncCode"
                        style="flex:1;min-width:0;background:#111827;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:0.3rem 0.5rem;font-size:0.8rem;font-family:inherit;"
                        placeholder="동기화 코드 (기기마다 동일하게 입력)"
                        value="${escapeHtml(getSyncCode())}" />
                      <button type="button" id="btnSaveSyncCode" class="tts-btn">저장</button>
                    </div>
                    <p class="meta" style="margin:0.35rem 0 0;font-size:0.76rem;line-height:1.45;">같은 코드를 입력한 기기끼리 "몰랐어요 ✗" 표시와 단어장이 자동으로 공유됩니다. 코드는 원하는 아무 문자열이나 직접 정하면 됩니다.</p>`
                  : `<p class="meta" style="margin:0.4rem 0 0;font-size:0.76rem;line-height:1.45;">코드 안의 <code>FIREBASE_CONFIG</code> 값을 채우면 이 기능이 켜집니다. 그전까지는 오답 표시가 이 기기에만 저장됩니다.</p>`}
              </div>
            </div>
          </div>
        `;
        document.getElementById("btnModeDaily").onclick = () => {
          startDailyMode();
        };
        document.getElementById("btnModeTruth").onclick = () => {
          startTruthMode();
        };
        document.getElementById("btnModeVerbs").onclick = () => {
          renderModalDrill();
        };
        document.getElementById("btnModeHaveBeen").onclick = () => {
          renderHaveBeenDrill();
        };
        document.getElementById("btnModeBible").onclick = () => {
          renderDailyDrill();
        };
        document.getElementById("btnVocabBook").onclick = () => {
          renderVocabBook();
        };
        document.getElementById("btnMemoBook").onclick = () => {
          renderVocabBook(MEMO_STORE);
        };
        const modeTtsRate = document.getElementById("modeTtsRate");
        if (modeTtsRate) {
          modeTtsRate.onchange = () => {
            setSavedTtsRate(modeTtsRate.value);
          };
        }
        const modeCardFace = document.getElementById("modeCardFace");
        if (modeCardFace) {
          modeCardFace.onchange = () => {
            setSavedCardFace(modeCardFace.value);
          };
        }
        const btnSaveGeminiKey = document.getElementById("btnSaveGeminiKey");
        if (btnSaveGeminiKey) {
          btnSaveGeminiKey.onclick = () => {
            const val = (document.getElementById("modeGeminiKey")?.value || "").trim();
            setGeminiApiKey(val);
            btnSaveGeminiKey.textContent = "저장됨 ✓";
            setTimeout(() => { btnSaveGeminiKey.textContent = "저장"; }, 1500);
          };
        }
        const btnSaveSyncCode = document.getElementById("btnSaveSyncCode");
        if (btnSaveSyncCode) {
          btnSaveSyncCode.onclick = () => {
            const val = (document.getElementById("modeSyncCode")?.value || "").trim();
            setSyncCode(val);
            btnSaveSyncCode.textContent = "저장됨 ✓";
            setTimeout(() => { btnSaveSyncCode.textContent = "저장"; }, 1500);
          };
        }
        backgroundSyncVocabStores();
      }

      function main() {
        initEnglishWordLookup();
        if ("speechSynthesis" in window) {
          // 일부 브라우저는 getVoices()를 미리 호출해야 음성 목록이 채워집니다.
          window.speechSynthesis.getVoices();
        }
        renderModePicker();
      }

      main();
    })();
  </script>
</body>
</html>
