<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>영어 읽기</title>
  <style>
    :root {
      --bg: #0f1218;
      --surface: #171c26;
      --border: #2a3344;
      --text: #e8ecf4;
      --muted: #8b95a8;
      --accent: #6c9eff;
      --success: #5ecf8a;
      --warn: #ffc86b;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .wrap { max-width: 680px; margin: 0 auto; padding: 1.25rem 1rem 8rem; }
    h1 { font-size: 1.2rem; margin: 0 0 .75rem; }
    details { margin-bottom: 1rem; }
    summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
    textarea {
      width: 100%; min-height: 160px; margin-top: .5rem;
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: .6rem; font: inherit; font-size: .9rem;
    }
    .hint { color: var(--muted); font-size: .8rem; }
    .controls {
      position: sticky; top: 0; z-index: 5;
      display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
      padding: .6rem 0; background: var(--bg);
    }
    button, select {
      background: var(--surface); color: var(--text);
      border: 1px solid var(--border); border-radius: 10px;
      padding: .45rem .8rem; font: inherit; font-size: .9rem; cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #0b1020; font-weight: 600; }
    label.chk { font-size: .85rem; color: var(--muted); display: flex; gap: .3rem; align-items: center; }
    body.mode-reader .cards-only { display: none; }

    /* 문장 카드 모드 */
    ol { list-style: none; padding: 0; margin: 0; }
    li {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: .75rem .9rem; margin-bottom: .5rem;
      cursor: pointer; transition: border-color .2s, background .2s;
    }
    li.active { border-color: var(--accent); background: #1c2536; }
    .en { font-size: 1.05rem; }
    .num { color: var(--muted); font-size: .8rem; margin-right: .4rem; user-select: none; }
    .ko {
      margin-top: .3rem; color: var(--success); font-size: .95rem;
      filter: blur(6px); opacity: .5; transition: filter .3s, opacity .3s;
      user-select: none;
    }
    li.revealed .ko, body.show-all .ko { filter: none; opacity: 1; user-select: auto; }

    /* 읽기 모드 */
    .reader { font-size: 1.12rem; line-height: 1.85; }
    .reader h2 { font-size: 1.05rem; color: var(--accent); margin: 2rem 0 .75rem; }
    .reader h1 { font-size: 1.3rem; }
    .reader p { margin: 0 0 1rem; }
    ::selection { background: rgba(108, 158, 255, .45); }
    .w { cursor: pointer; border-radius: 4px; -webkit-tap-highlight-color: transparent; }
    .w.sel { background: rgba(108, 158, 255, .45); }
    .w.start { background: rgba(255, 200, 107, .45); outline: 1px dashed var(--warn); }
    /* 책갈피 */
    .w.bm { text-decoration: underline 3px var(--warn); text-underline-offset: 4px; }
    .w.bm::before { content: "🔖"; font-size: .8em; margin-right: .15em; }
    #popMark.on { background: var(--warn); border-color: var(--warn); }
    .toast {
      position: fixed; left: 50%; top: 1rem; transform: translateX(-50%); z-index: 30;
      background: #222b3b; border: 1px solid var(--warn); color: var(--text);
      padding: .45rem .9rem; border-radius: 99px; font-size: .88rem; display: none;
    }

    /* 뜻·발음 팝업 */
    /* 화면 아래 고정 패널: 본문을 가리지 않음 */
    #pop {
      position: fixed; z-index: 20; display: none;
      left: 50%; bottom: 0; transform: translateX(-50%);
      width: min(680px, 100%); max-height: 40vh; overflow-y: auto;
      background: #222b3b; border: 1px solid var(--accent); border-bottom: none;
      border-radius: 14px 14px 0 0;
      padding: .7rem 1rem calc(.8rem + env(safe-area-inset-bottom)); font-size: .95rem;
      box-shadow: 0 -8px 24px rgba(0,0,0,.45);
    }
    #pop .head { display: flex; gap: .4rem; align-items: flex-start; }
    #pop .src { flex: 1; font-weight: 600; word-break: break-word; }
    #pop .head button { padding: .2rem .5rem; font-size: .85rem; }
    #pop .pron { color: var(--warn); font-size: .9rem; margin-top: .25rem; }
    #pop .out { color: var(--success); white-space: pre-wrap; margin-top: .35rem; }
    #pop .note { color: var(--muted); font-size: .85rem; margin-top: .3rem; white-space: pre-wrap; }
    #pop input { width: 100%; margin-top: .4rem; padding: .35rem .5rem; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; font-size: .85rem; }

    .page-nav { display: flex; gap: .4rem; margin: 0 0 1rem; }
    .page-nav a {
      flex: 1; text-align: center; text-decoration: none;
      padding: .5rem .6rem; border-radius: 10px; font-size: .9rem;
      color: #8b95a8; background: #171c26; border: 1px solid #2a3344;
    }
    .page-nav a.on { color: #0b1020; background: #6c9eff; border-color: #6c9eff; font-weight: 600; }
  </style>
</head>
<body>
  <div class="wrap">
    <nav class="page-nav">
      <a href="index.html">🃏 랜덤 카드</a>
      <a href="speack.html" class="on" aria-current="page">📖 영어 읽기</a>
    </nav>
    <h1>영어 읽기</h1>

    <div class="controls">
      <select id="source">
        <option value="story:data/the-blue-diamond.txt">The Blue Diamond (읽기)</option>
        <option value="cards:data/10min-english-269.json">10분영어 #269 (문장)</option>
        <option value="custom">직접 붙여넣기</option>
      </select>
      <button id="play" class="primary cards-only">▶ 전체 재생</button>
      <button id="stop">■ 정지</button>
      <select id="rate">
        <option value="0.6">0.6x</option>
        <option value="0.8">0.8x</option>
        <option value="1" selected>1x</option>
        <option value="1.2">1.2x</option>
      </select>
      <label class="chk cards-only"><input type="checkbox" id="showAll" /> 해석 모두 보기</label>
      <label class="chk"><input type="checkbox" id="autoSpeak" checked /> 탭하면 소리</label>
      <button id="goMark" title="책갈피 위치로 이동" disabled>🔖 책갈피로</button>
      <label class="chk">🐢
        <select id="slowRate" title="거북이 버튼 속도">
          <option value="0.6">0.6x</option>
          <option value="0.5">0.5x</option>
          <option value="0.4" selected>0.4x</option>
          <option value="0.3">0.3x</option>
          <option value="0.2">0.2x</option>
        </select>
      </label>
    </div>

    <details id="customBox" hidden>
      <summary>텍스트 붙여넣기</summary>
      <textarea id="script" placeholder="영어 글을 그대로 붙여넣으세요.&#10;(한글 줄 + 영어 줄을 번갈아 넣으면 문장 카드로 보여줍니다)"></textarea>
      <button id="load" style="margin-top:.5rem">불러오기</button>
    </details>

    <p class="hint">단어를 <b>탭</b>하면 그 단어 뜻, 이어서 <b>끝 단어를 탭</b>하면 그 구간의 뜻·발음이 나와요. (PC에서는 드래그도 OK)</p>

    <ol id="list" class="cards-only"></ol>
    <article id="reader" class="reader"></article>
  </div>

  <div id="pop">
    <div class="head">
      <div class="src"></div>
      <button id="popSpeak" title="발음 듣기">🔊</button>
      <button id="popSlow" title="천천히 듣기">🐢</button>
      <button id="popMark" title="여기까지 읽음 (책갈피)">🔖</button>
      <button id="popClose" title="닫기">✕</button>
    </div>
    <div class="pron"></div>
    <div class="out"></div>
    <div class="note"></div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- 책갈피 기기 간 동기화 (index.html 과 같은 Firebase·같은 동기화 코드). 못 불러와도 이 기기 저장으로 동작 -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script>
    const listEl = document.getElementById("list");
    const readerEl = document.getElementById("reader");
    const rateEl = document.getElementById("rate");
    const sourceEl = document.getElementById("source");
    let items = [];       // 문장 카드 모드: [{en, ko}]
    let runId = 0;

    function hasHangul(s) { return /[가-힣]/.test(s); }

    // ───────── TTS ─────────
    function pickVoice() {
      const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith("en"));
      return vs.find(v => /Samantha|Google US English|Alex/.test(v.name)) || vs.find(v => v.lang === "en-US") || vs[0];
    }
    function speak(text, rate) {
      return new Promise(resolve => {
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "en-US";
        const v = pickVoice(); if (v) u.voice = v;
        u.rate = rate ?? parseFloat(rateEl.value);
        u.onend = u.onerror = resolve;
        speechSynthesis.speak(u);
      });
    }
    function stop() { runId++; speechSynthesis.cancel(); }

    // ───────── 문장 카드 모드 ─────────
    function parseCards(text) {
      const lines = text.split(/\r?\n/).map(l => l.trim().replace(/^\d+[.)]\s*/, "")).filter(Boolean);
      const out = []; let ko = null;
      for (const line of lines) {
        if (hasHangul(line)) ko = line;
        else { out.push({ en: line, ko: ko || "" }); ko = null; }
      }
      return out;
    }

    // 단어마다 <span class="w">로 감싸 탭으로 고를 수 있게 한다
    function appendWords(el, text) {
      text.split(/(\s+)/).forEach(tok => {
        if (!tok) return;
        if (/^\s+$/.test(tok)) { el.append(" "); return; }
        const w = document.createElement("span");
        w.className = "w"; w.textContent = tok;
        el.appendChild(w);
      });
    }

    function renderCards() {
      listEl.innerHTML = "";
      items.forEach((it, i) => {
        const li = document.createElement("li");
        li.innerHTML = `<div class="en"><span class="num">${i + 1}</span></div><div class="ko"></div>`;
        appendWords(li.querySelector(".en"), it.en);
        li.querySelector(".ko").textContent = it.ko || "(해석 없음)";
        li.addEventListener("click", e => {
          if (e.target.closest(".w") || String(window.getSelection())) return; // 단어 탭·블럭 중이면 재생 안 함
          stop(); playFrom(i, true);
        });
        listEl.appendChild(li);
      });
    }

    function setActive(i) {
      listEl.querySelectorAll("li.active").forEach(el => el.classList.remove("active"));
      const li = listEl.children[i];
      if (!li) return;
      li.classList.add("active");
      li.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    async function playFrom(start, onlyOne = false) {
      const id = ++runId;
      for (let i = start; i < items.length; i++) {
        if (id !== runId) return;
        setActive(i);
        await speak(items[i].en);
        if (id !== runId) return;
        listEl.children[i].classList.add("revealed");
        if (onlyOne) break;
        await new Promise(r => setTimeout(r, 900));
      }
    }

    document.getElementById("play").onclick = () => {
      stop();
      const active = [...listEl.children].findIndex(li => li.classList.contains("active"));
      playFrom(active >= 0 && active < items.length - 1 ? active : 0);
    };
    document.getElementById("stop").onclick = stop;
    document.getElementById("showAll").onchange = e => document.body.classList.toggle("show-all", e.target.checked);

    // ───────── 읽기 모드 ─────────
    function renderStory(text) {
      readerEl.innerHTML = "";
      text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean).forEach(block => {
        let el;
        if (block.startsWith("## ")) { el = document.createElement("h2"); el.textContent = block.slice(3); }
        else if (block.startsWith("# ")) { el = document.createElement("h1"); el.textContent = block.slice(2); }
        else { el = document.createElement("p"); appendWords(el, block.replace(/\s*\n\s*/g, " ")); }
        readerEl.appendChild(el);
      });
    }

    // ───────── 소스 불러오기 ─────────
    function setMode(mode) {
      document.body.classList.toggle("mode-reader", mode === "story");
      if (mode === "story") listEl.innerHTML = ""; else readerEl.innerHTML = "";
    }

    async function loadSource() {
      stop(); hidePop();
      const v = sourceEl.value;
      document.getElementById("customBox").hidden = v !== "custom";
      if (v === "custom") { document.getElementById("customBox").open = true; return; }
      const [kind, url] = [v.slice(0, v.indexOf(":")), v.slice(v.indexOf(":") + 1)];
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(res.status);
        if (kind === "cards") {
          const data = await res.json();
          items = data.cards.map(c => ({ en: c.answer, ko: c.situation }));
          setMode("cards"); renderCards();
        } else {
          setMode("story"); renderStory(await res.text());
        }
        applyBookmark(true); // 지난번 읽던 곳으로
      } catch (e) {
        setMode("story");
        readerEl.innerHTML = `<p class="hint">파일을 불러오지 못했어요 (${url}). 로컬 서버로 열거나 '직접 붙여넣기'를 사용하세요.</p>`;
      }
    }
    sourceEl.onchange = loadSource;

    document.getElementById("load").onclick = () => {
      const text = document.getElementById("script").value.trim();
      if (!text) return;
      stop();
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      const koLines = lines.filter(hasHangul).length;
      if (koLines > 0 && koLines >= lines.length / 3) { items = parseCards(text); setMode("cards"); renderCards(); }
      else { setMode("story"); renderStory(text); }
      applyBookmark(false);
    };

    // ───────── 블럭한 부분: 뜻 + 발음 (index.html에 저장된 OpenAI 키 사용) ─────────
    const LS_OPENAI_KEY = "english-card-gemini-key"; // index.html 설정 화면과 같은 저장소 키
    const OPENAI_URL = "https://api.openai.com/v1/chat/completions";
    const OPENAI_MODEL = "gpt-5-mini";
    const pop = document.getElementById("pop");
    const popSrc = pop.querySelector(".src");
    const popPron = pop.querySelector(".pron");
    const popOut = pop.querySelector(".out");
    const popNote = pop.querySelector(".note");
    const cache = new Map();
    let selSeq = 0;
    let currentPart = "";

    // 탭할 때 자동 발음 on/off (기기에 기억)
    const LS_AUTO_SPEAK = "speack-auto-speak";
    const autoSpeakEl = document.getElementById("autoSpeak");
    try { autoSpeakEl.checked = localStorage.getItem(LS_AUTO_SPEAK) !== "off"; } catch {}
    autoSpeakEl.onchange = () => {
      try { localStorage.setItem(LS_AUTO_SPEAK, autoSpeakEl.checked ? "on" : "off"); } catch {}
      if (!autoSpeakEl.checked) speechSynthesis.cancel();
    };

    document.getElementById("popClose").onclick = () => { resetTap(); hidePop(); };
    document.getElementById("popSpeak").onclick = () => { speechSynthesis.cancel(); speak(currentPart); };
    // 🐢 버튼 속도 (기기에 기억, 기본 0.4x)
    const LS_SLOW_RATE = "speack-slow-rate";
    const slowRateEl = document.getElementById("slowRate");
    try { const v = localStorage.getItem(LS_SLOW_RATE); if (v && slowRateEl.querySelector(`option[value="${v}"]`)) slowRateEl.value = v; } catch {}
    slowRateEl.onchange = () => {
      try { localStorage.setItem(LS_SLOW_RATE, slowRateEl.value); } catch {}
      if (currentPart && pop.style.display === "block") { speechSynthesis.cancel(); speak(currentPart, parseFloat(slowRateEl.value)); } // 바꾸자마자 들어보기
    };
    document.getElementById("popSlow").onclick = () => { speechSynthesis.cancel(); speak(currentPart, parseFloat(slowRateEl.value)); };

    function getKey() {
      try { return (localStorage.getItem(LS_OPENAI_KEY) || "").trim(); } catch { return ""; }
    }

    async function explain(part, sentence) {
      const ck = part + "||" + sentence;
      if (cache.has(ck)) return cache.get(ck);
      const res = await fetch(OPENAI_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${getKey()}` },
        body: JSON.stringify({
          model: OPENAI_MODEL,
          messages: [{
            role: "user",
            content:
`영어 학습자가 글을 읽다가 모르는 부분을 블럭했어.
문맥 문장: "${sentence}"
블럭한 부분: "${part}"

아래 JSON으로만 답해:
{"ipa": "블럭한 부분의 미국식 발음기호(IPA)", "ko_pron": "실제 들리는 대로 한글로 적은 발음(연음 반영)", "meaning": "이 문맥에서의 한국어 뜻 (짧게)", "note": "숙어·문법·뉘앙스 등 알아두면 좋은 점 한 줄, 없으면 빈 문자열"}
블럭한 부분이 문장 전체라면 meaning은 자연스러운 한국어 번역으로.`,
          }],
          response_format: { type: "json_object" },
          reasoning_effort: "minimal",
          max_completion_tokens: 600,
        }),
      });
      if (!res.ok) throw new Error(`OpenAI 오류 ${res.status}`);
      const data = await res.json();
      const raw = data?.choices?.[0]?.message?.content || "{}";
      let out;
      try { out = JSON.parse(raw); } catch { out = { meaning: raw }; }
      cache.set(ck, out);
      return out;
    }

    function hidePop() { pop.style.display = "none"; document.body.style.paddingBottom = ""; }

    // 패널은 화면 아래에 고정. 고른 단어가 패널 뒤로 숨으면 위로 스크롤해 보이게 한다
    function placePop(anchor) {
      pop.style.display = "block";
      const fit = () => {
        const h = pop.offsetHeight;
        const rect = anchor.getBoundingClientRect();
        document.body.style.paddingBottom = h + "px"; // 마지막 문단도 패널 위로 올라올 수 있게
        const ROOM_BELOW = 130; // 고른 단어 아래로 2~3줄은 보이게 남겨 둬서 끝 단어를 바로 탭할 수 있게
        const overlap = rect.bottom + ROOM_BELOW - (window.innerHeight - h);
        if (overlap > 0) window.scrollBy({ top: overlap, behavior: "smooth" });
      };
      fit();
      return fit;
    }

    const CONTAINER_SEL = ".en, .reader p, .reader h2";

    // 고른 부분이 들어 있는 문장(문맥)을 찾는다
    function contextSentence(container, part) {
      const text = container.textContent.replace(/^\d+/, "").trim();
      if (container.matches(".en")) return text;
      const sentences = text.match(/[^.!?]+[.!?]+["”']?/g) || [text];
      return sentences.find(s => s.includes(part)) || sentences.find(s => s.includes(part.split(" ")[0])) || text.slice(0, 400);
    }

    async function lookup(part, container, anchor) {
      part = part.trim().replace(/\s+/g, " ");
      if (!part || part.length > 600) return;
      const seq = ++selSeq;
      currentPart = part;
      lastWord = anchor instanceof Range
        ? (anchor.endContainer.nodeType === 1 ? anchor.endContainer : anchor.endContainer.parentElement)?.closest(".w")
        : anchor;
      updateMarkBtn();
      popSrc.textContent = part;
      popPron.textContent = ""; popNote.textContent = "";
      const refit = placePop(anchor);
      if (autoSpeakEl.checked) { speechSynthesis.cancel(); speak(part); } // 설정이 켜져 있으면 바로 발음 들려주기

      if (!getKey()) {
        popOut.innerHTML = 'OpenAI API 키가 없습니다. 입력 후 Enter:<input type="password" placeholder="sk-..." />';
        const input = popOut.querySelector("input");
        input.onkeydown = e => {
          if (e.key !== "Enter" || !input.value.trim()) return;
          try { localStorage.setItem(LS_OPENAI_KEY, input.value.trim()); } catch {}
          lookup(part, container, anchor);
        };
        return;
      }
      popOut.textContent = "뜻 찾는 중…";
      try {
        const r = await explain(part, contextSentence(container, part));
        if (seq !== selSeq) return;
        popPron.textContent = [r.ipa && `/${String(r.ipa).replace(/^\/|\/$/g, "")}/`, r.ko_pron && `[${r.ko_pron}]`].filter(Boolean).join("  ");
        popOut.textContent = r.meaning || "(결과 없음)";
        popNote.textContent = r.note || "";
        refit(); // 내용이 길어져 패널이 커지면 다시 맞춤
      } catch (e) {
        if (seq === selSeq) popOut.textContent = e.message;
      }
    }

    // ── 책갈피: 마지막으로 고른 단어 위치를 글마다 기억 ──
    // 위치 = { block: 문단(또는 카드) 번호, word: 그 안의 단어 번호 }
    let lastWord = null;
    const bmKey = () => "speack-bookmark:" + sourceEl.value;
    const blocks = () => [...(document.body.classList.contains("mode-reader") ? readerEl.children : listEl.children)];
    // 저장 형식: { block, word, ts } / 지운 경우 { removed: true, ts } (다른 기기 책갈피가 되살아나지 않게)
    function getRaw(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } }
    function setRaw(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
    function getBm() { const v = getRaw(bmKey()); return v && !v.removed ? v : null; }
    function setBm(v) {
      const k = bmKey();
      setRaw(k, v ? { block: v.block, word: v.word, ts: Date.now() } : { removed: true, ts: Date.now() });
      return pushBookmark(k);
    }

    function posOf(word) {
      const bs = blocks();
      const block = bs.find(b => b.contains(word));
      if (!block) return null;
      return { block: bs.indexOf(block), word: [...block.querySelectorAll(".w")].indexOf(word) };
    }
    function wordAt(pos) {
      const block = pos && blocks()[pos.block];
      return block && (block.querySelectorAll(".w")[pos.word] || block.querySelector(".w"));
    }
    function updateMarkBtn() {
      const bm = getBm();
      const on = !!(bm && lastWord && wordAt(bm) === lastWord);
      const b = document.getElementById("popMark");
      b.classList.toggle("on", on);
      b.title = on ? "책갈피 지우기" : "여기까지 읽음 (책갈피)";
    }
    let toastTimer;
    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg; t.style.display = "block";
      clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = "none"; }, 1600);
    }
    function applyBookmark(scroll) {
      document.querySelectorAll(".w.bm").forEach(w => w.classList.remove("bm"));
      const w = wordAt(getBm());
      document.getElementById("goMark").disabled = !w;
      if (!w) return;
      w.classList.add("bm");
      if (scroll) {
        w.scrollIntoView({ block: "center" });
        toast("🔖 지난번 읽던 곳이에요");
      }
    }
    document.getElementById("popMark").onclick = () => {
      if (!lastWord || !lastWord.isConnected) return;
      const bm = getBm();
      const removing = bm && wordAt(bm) === lastWord;
      setBm(removing ? null : posOf(lastWord)).then(ok => {
        const where = ok ? " · 다른 기기에도 저장됨" : getSyncCode() ? " · 동기화 실패(이 기기에만)" : " · 이 기기에만 (동기화 코드 없음)";
        toast((removing ? "책갈피를 지웠어요" : "🔖 저장했어요") + where);
      });
      applyBookmark(false);
      updateMarkBtn();
    };
    document.getElementById("goMark").onclick = () => {
      const w = wordAt(getBm());
      if (w) w.scrollIntoView({ behavior: "smooth", block: "center" });
    };

    // ── 방법 1: 단어 탭 (시작 단어 탭 → 끝 단어 탭) ──
    let tap = null; // { container, startIdx, done }

    function clearMarks() {
      document.querySelectorAll(".w.sel, .w.start").forEach(w => w.classList.remove("sel", "start"));
    }
    function resetTap() { tap = null; clearMarks(); }

    function onWordTap(span) {
      const container = span.closest(CONTAINER_SEL);
      if (!container) return;
      const words = [...container.querySelectorAll(".w")];
      const idx = words.indexOf(span);

      if (tap && tap.container === container && !tap.done) {
        if (idx === tap.startIdx) { resetTap(); hidePop(); return; } // 같은 단어 다시 탭 → 취소
        // 두 번째 탭: 시작~끝 구간
        const [a, b] = idx < tap.startIdx ? [idx, tap.startIdx] : [tap.startIdx, idx];
        clearMarks();
        const range = words.slice(a, b + 1);
        range.forEach(w => w.classList.add("sel"));
        tap.done = true;
        const part = range.map(w => w.textContent).join(" ").replace(/^["“'(]+|["”')]+$/g, "");
        lookup(part, container, words[b]);
        return;
      }
      // 첫 탭: 시작 단어 (그 단어 뜻도 바로 보여줌)
      clearMarks();
      span.classList.add("start");
      tap = { container, startIdx: idx, done: false };
      const word = span.textContent.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, "");
      lookup(word || span.textContent, container, span);
    }

    document.addEventListener("click", e => {
      if (pop.contains(e.target)) return;
      if (String(window.getSelection()).trim()) return; // 드래그 선택은 아래에서 처리
      const w = e.target.closest(".w");
      if (w) { onWordTap(w); return; }
      resetTap(); hidePop(); // 빈 곳 탭 → 닫기
    });

    // ── 방법 2: 드래그 블럭 (PC, 또는 폰에서 길게 눌러 선택) ──
    let selTimer;
    function onDragSelection() {
      const sel = window.getSelection();
      const part = String(sel).trim();
      if (!part || !sel.rangeCount || part === currentPart && pop.style.display === "block") return;
      const node = sel.anchorNode;
      const container = (node && (node.nodeType === 1 ? node : node.parentElement))?.closest(CONTAINER_SEL);
      if (!container) return;
      resetTap();
      lookup(part, container, sel.getRangeAt(0).cloneRange());
    }
    document.addEventListener("mouseup", e => {
      if (pop.contains(e.target)) return;
      clearTimeout(selTimer); selTimer = setTimeout(onDragSelection, 10);
    });
    document.addEventListener("selectionchange", () => {
      clearTimeout(selTimer); selTimer = setTimeout(onDragSelection, 800);
    });

    // ── 책갈피 동기화 (Firestore: wrongCardsSync/{동기화 코드}.speack.bookmarks) ──
    // 동기화 코드는 랜덤 카드(index.html) 설정에서 넣은 것과 같은 값을 쓴다.
    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyABrVfFnmV9ygf3AUAJmEnoRoeEkrOcd0U",
      authDomain: "random-card-8ee6e.firebaseapp.com",
      projectId: "random-card-8ee6e",
      storageBucket: "random-card-8ee6e.firebasestorage.app",
      messagingSenderId: "703954283174",
      appId: "1:703954283174:web:c23782aad7cecbf0616267",
    };
    const SYNC_CODE_KEY = "english-card-sync-code";
    const SYNC_FIELD = "speack";
    let fsDb = null, fsReady = null;

    function getSyncCode() { try { return (localStorage.getItem(SYNC_CODE_KEY) || "").trim(); } catch { return ""; } }
    function fsSignIn() {
      if (!window.firebase || !getSyncCode()) return Promise.resolve(false);
      if (!fsReady) {
        try {
          const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
          fsDb = firebase.firestore(app);
          fsReady = firebase.auth(app).signInAnonymously().then(() => true).catch(e => {
            console.warn("동기화 로그인 실패:", e); fsReady = null; return false;
          });
        } catch (e) { console.warn("Firebase 초기화 실패:", e); return Promise.resolve(false); }
      }
      return fsReady;
    }
    const remoteKey = k => k.replace(/[^A-Za-z0-9_-]/g, "_");
    const docRef = () => fsDb.collection("wrongCardsSync").doc(getSyncCode());
    const knownKeys = () => [...sourceEl.options].map(o => "speack-bookmark:" + o.value);

    async function pushBookmark(k) {
      try {
        if (!(await fsSignIn())) return false;
        await docRef().set({ [SYNC_FIELD]: { bookmarks: { [remoteKey(k)]: getRaw(k) } } }, { merge: true });
        return true;
      } catch (e) { console.warn("책갈피 올리기 실패:", e); return false; }
    }

    // 클라우드와 비교해 더 최근 것을 쓴다. 지금 보고 있는 글의 책갈피가 바뀌었으면 true
    async function pullBookmarks() {
      try {
        if (!(await fsSignIn())) return false;
        const snap = await docRef().get();
        const remote = ((snap.exists && snap.data()) || {})[SYNC_FIELD]?.bookmarks || {};
        let changedCurrent = false;
        const toPush = {};
        for (const k of knownKeys()) {
          const l = getRaw(k), r = remote[remoteKey(k)];
          if (r && (r.ts || 0) > (l?.ts || 0)) { setRaw(k, r); if (k === bmKey()) changedCurrent = true; }
          else if (l && (l.ts || 0) > (r?.ts || 0)) toPush[remoteKey(k)] = l; // 오프라인일 때 저장한 것 올리기
        }
        if (Object.keys(toPush).length) await docRef().set({ [SYNC_FIELD]: { bookmarks: toPush } }, { merge: true });
        return changedCurrent;
      } catch (e) { console.warn("책갈피 받기 실패:", e); return false; }
    }

    let userMoved = false; // 들어온 뒤 직접 단어를 골랐으면 화면을 멋대로 옮기지 않는다
    document.addEventListener("click", e => { if (e.target.closest(".w")) userMoved = true; }, true);
    async function syncAndApply() {
      if (await pullBookmarks()) applyBookmark(!userMoved);
    }
    sourceEl.addEventListener("change", () => { userMoved = false; });
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncAndApply(); });

    loadSource().then(syncAndApply);
  </script>
</body>
